<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Battlecard Library</title>
    <link rel="icon" href="{{ url_for('static', filename='images/ia_logo.png') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600;700&family=Lato:wght@400&display=swap" rel="stylesheet">
    <style>
        :root {
            --impact-blue: #264CD7;
            --impact-blue-dark: #1D3CAF;
            --off-white: #F4F4F6;
            --black: #1C1B1B;
            --white: #FFFFFF;
            --orange: #FF6F1C;
            --gray1: #E4E4E4;
            --gray2: #D7D6D2;
            --gray3: #B3B2AD;
            --merch: #BEA8EF;
            --inventory: #E3F576;
            --pricing: #3DD499;
            --data: #BFD1F5;
            --r: 16px;
            --r-sm: 9px;
            --shadow: 0 1px 2px rgba(28,27,27,.04), 0 8px 24px rgba(28,27,27,.05);
            --shadow-up: 0 2px 4px rgba(28,27,27,.05), 0 16px 40px rgba(38,76,215,.11);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter Tight', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--off-white); color: var(--black);
            font-size: 15px; line-height: 1.5;
        }
        a { color: var(--impact-blue); }

        header.top {
            background: var(--black); height: 58px; padding: 0 26px;
            display: flex; align-items: center; justify-content: space-between;
            position: sticky; top: 0; z-index: 40;
        }
        .brand { display: flex; align-items: center; gap: 13px; }
        .brand img { height: 27px; }
        .brand b { color: #fff; font-weight: 600; font-size: 16px; letter-spacing: -.3px; }
        .brand .tag {
            font-size: 9.5px; font-weight: 600; letter-spacing: .7px; text-transform: uppercase;
            color: var(--data); border: 1px solid rgba(191,209,245,.35);
            padding: 2px 7px; border-radius: 20px;
        }
        .top .right { display: flex; gap: 18px; align-items: center; }
        .top .right a { color: var(--gray3); font-size: 13px; text-decoration: none; }
        .top .right a:hover, .top .right a.on { color: #fff; }

        /* ── Hero on Impact Blue, with the brand grid pattern ────── */
        .hero {
            background: var(--impact-blue); color: #fff; padding: 46px 30px 54px;
            position: relative; overflow: hidden;
        }
        .hero::before {
            content: ''; position: absolute; inset: -2px;
            background-image:
                linear-gradient(rgba(255,255,255,.10) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,.10) 1px, transparent 1px);
            background-size: 46px 46px; background-position: -1px -1px;
            pointer-events: none;
        }
        .hero .wrap { max-width: 1180px; margin: 0 auto; position: relative; }
        .hero h1 { font-size: 36px; font-weight: 600; letter-spacing: -1.1px; line-height: 1.12; }
        .hero p { margin-top: 10px; max-width: 610px; color: rgba(255,255,255,.82); font-size: 15.5px; }
        .counts { display: flex; gap: 34px; margin-top: 30px; }
        .count b {
            display: block; font-size: 30px; font-weight: 600; letter-spacing: -1px; line-height: 1;
        }
        .count span {
            display: block; margin-top: 5px; font-size: 10.5px; font-weight: 600;
            letter-spacing: .8px; text-transform: uppercase; color: rgba(255,255,255,.62);
        }

        /* ── Controls ────────────────────────────────────────────── */
        .body { max-width: 1180px; margin: 0 auto; padding: 0 30px 70px; }
        .bar {
            display: flex; gap: 11px; align-items: center; flex-wrap: wrap;
            background: var(--white); border: 1px solid var(--gray1);
            border-radius: var(--r); padding: 14px; margin-top: -26px;
            box-shadow: var(--shadow); position: relative; z-index: 5;
        }
        .bar input[type=search] {
            flex: 1; min-width: 220px; padding: 11px 13px; border: 1px solid var(--gray1);
            border-radius: var(--r-sm); font-family: inherit; font-size: 15px; color: var(--black);
        }
        .bar input:focus, .bar select:focus {
            outline: none; border-color: var(--impact-blue); box-shadow: 0 0 0 3px rgba(38,76,215,.11);
        }
        .bar select {
            padding: 11px 13px; border: 1px solid var(--gray1); border-radius: var(--r-sm);
            font-family: inherit; font-size: 15px; background: var(--white); color: var(--black);
        }
        .btn {
            display: inline-flex; align-items: center; gap: 7px; border: none;
            border-radius: var(--r-sm); padding: 11px 18px; font-family: inherit;
            font-size: 14.5px; font-weight: 600; cursor: pointer; text-decoration: none;
        }
        .btn-primary { background: var(--impact-blue); color: #fff; }
        .btn-primary:hover { background: var(--impact-blue-dark); }
        .btn-quiet { background: var(--white); color: var(--black); border: 1px solid var(--gray1); }
        .btn-quiet:hover { border-color: var(--impact-blue); color: var(--impact-blue); }
        .btn-sm { padding: 8px 13px; font-size: 13px; }

        /* ── Gallery ─────────────────────────────────────────────── */
        .grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
            gap: 20px; margin-top: 26px;
        }
        .card {
            background: var(--white); border: 1px solid var(--gray1);
            border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden;
            cursor: pointer; display: flex; flex-direction: column;
            transition: transform .14s ease, box-shadow .14s ease;
        }
        .card:hover { transform: translateY(-3px); box-shadow: var(--shadow-up); }
        .card .accent { height: 5px; }
        .card .pad { padding: 17px 19px 19px; flex: 1; display: flex; flex-direction: column; }
        .card .kicker {
            font-size: 10px; font-weight: 600; letter-spacing: .7px; text-transform: uppercase;
            color: var(--impact-blue); display: flex; gap: 8px; align-items: center;
        }
        .card .kicker .dot { width: 8px; height: 8px; border-radius: 2px; }
        .card h3 {
            font-size: 20px; font-weight: 600; letter-spacing: -.5px; margin: 9px 0 0;
            line-height: 1.2;
        }
        .card .line { font-size: 13.5px; color: #636363; margin-top: 8px; line-height: 1.45; flex: 1; }
        .card .foot {
            display: flex; gap: 7px; flex-wrap: wrap; align-items: center;
            margin-top: 15px; padding-top: 14px; border-top: 1px solid var(--gray1);
        }
        .pill {
            font-size: 11px; font-weight: 600; padding: 4px 9px; border-radius: 20px;
            background: var(--off-white); color: #555;
        }
        .pill.blue { background: rgba(38,76,215,.09); color: var(--impact-blue); }
        .pill.warn { background: rgba(255,111,28,.11); color: #b4500f; }
        .pill.good { background: rgba(61,212,153,.16); color: #17795a; }
        .card .when { margin-left: auto; font-size: 11.5px; color: var(--gray3); font-family: 'Lato', sans-serif; }

        .empty {
            margin-top: 26px; background: var(--white); border: 1px dashed var(--gray2);
            border-radius: var(--r); padding: 54px 30px; text-align: center;
        }
        .empty b { display: block; font-size: 18px; font-weight: 600; }
        .empty p { color: var(--gray3); margin-top: 8px; font-size: 14.5px; }
        .empty .btn { margin-top: 20px; }

        /* ── Detail drawer ───────────────────────────────────────── */
        .scrim {
            position: fixed; inset: 0; background: rgba(28,27,27,.44);
            opacity: 0; pointer-events: none; transition: opacity .16s; z-index: 50;
        }
        .scrim.on { opacity: 1; pointer-events: auto; }
        .drawer {
            position: fixed; top: 0; right: 0; bottom: 0; width: min(680px, 100%);
            background: var(--off-white); z-index: 60; transform: translateX(100%);
            transition: transform .2s ease; display: flex; flex-direction: column;
        }
        .drawer.on { transform: none; }
        .dh {
            background: var(--white); border-bottom: 1px solid var(--gray1);
            padding: 20px 26px; flex: none; display: flex; gap: 16px; align-items: flex-start;
        }
        .dh h2 { font-size: 24px; font-weight: 600; letter-spacing: -.7px; line-height: 1.15; }
        .dh .sub { color: var(--gray3); font-size: 13px; margin-top: 5px; }
        .dh .x {
            margin-left: auto; flex: none; border: none; background: var(--off-white);
            width: 32px; height: 32px; border-radius: 50%; cursor: pointer;
            font-size: 17px; color: #555;
        }
        .dh .x:hover { background: var(--gray1); }
        .dbody { overflow-y: auto; padding: 22px 26px 40px; }
        .sec { background: var(--white); border: 1px solid var(--gray1); border-radius: var(--r); padding: 17px 19px; margin-bottom: 15px; }
        .sec > h4 {
            font-size: 10.5px; font-weight: 600; letter-spacing: .7px; text-transform: uppercase;
            color: var(--impact-blue); margin-bottom: 11px;
        }
        .sec p { font-size: 14px; line-height: 1.55; }
        .sec ul { margin: 0 0 0 17px; font-size: 14px; }
        .sec li { margin-bottom: 6px; line-height: 1.5; }
        .quote {
            background: var(--impact-blue); color: #fff; border-radius: var(--r);
            padding: 18px 20px; margin-bottom: 15px;
        }
        .quote h4 { font-size: 10.5px; font-weight: 600; letter-spacing: .7px; text-transform: uppercase; color: rgba(255,255,255,.66); margin-bottom: 8px; }
        .quote p { font-size: 15.5px; line-height: 1.5; }
        table.matrix { width: 100%; border-collapse: collapse; font-size: 13px; }
        table.matrix th {
            text-align: left; font-size: 10px; letter-spacing: .6px; text-transform: uppercase;
            color: var(--gray3); font-weight: 600; padding: 0 8px 8px 0;
        }
        table.matrix td { padding: 8px 8px 8px 0; border-top: 1px solid var(--gray1); vertical-align: top; }
        table.matrix td.cap { font-weight: 500; }
        .rate { font-weight: 600; font-size: 12px; white-space: nowrap; }
        .rate.strong { color: var(--impact-blue); }
        .rate.partial { color: var(--black); }
        .rate.none { color: var(--orange); }
        .rate.unknown { color: var(--gray3); }
        .dfoot {
            flex: none; background: var(--white); border-top: 1px solid var(--gray1);
            padding: 14px 26px; display: flex; gap: 10px; align-items: center;
        }
        .dfoot .sp { margin-left: auto; }
        .spin { display: inline-block; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        @media (max-width: 720px) {
            .hero { padding: 34px 20px 48px; }
            .hero h1 { font-size: 27px; }
            .body { padding: 0 20px 50px; }
            .counts { gap: 22px; }
        }
    </style>
</head>
<body>
<header class="top">
    <div class="brand">
        <img src="{{ url_for('static', filename='images/ia_logo.png') }}" alt="Impact Analytics">
        <b>Battlecard Builder</b>
        <span class="tag">Library</span>
    </div>
    <div class="right">
        <a href="{{ url_for('index') }}">Build a card</a>
        <a href="{{ url_for('library_page') }}" class="on">Library</a>
        <a href="{{ url_for('standardizer') }}">Slide Standardizer</a>
    </div>
</header>

<section class="hero">
    <div class="wrap">
        <h1>Every battlecard the team<br>has built, in one place.</h1>
        <p>Browse what colleagues researched, borrow the talk track, and rebuild any
           deck at the length you need. Cards are shared the moment they are generated.</p>
        <div class="counts" id="counts"></div>
    </div>
</section>

<div class="body">
    <div class="bar">
        <input type="search" id="q" placeholder="Search a competitor, a headline or a win theme">
        <select id="product"><option value="">Every product</option></select>
        <button class="btn btn-quiet" id="clearBtn">Clear</button>
        <a class="btn btn-primary" href="{{ url_for('index') }}">Build a new card</a>
    </div>
    <div id="results"></div>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true">
    <div class="dh">
        <div>
            <h2 id="dTitle"></h2>
            <div class="sub" id="dSub"></div>
        </div>
        <button class="x" id="dClose" title="Close">&#10005;</button>
    </div>
    <div class="dbody" id="dBody"></div>
    <div class="dfoot">
        <select id="dDepth">
            <option value="">Same length as saved</option>
            <option value="summary">Rebuild as Summary</option>
            <option value="standard">Rebuild as Standard</option>
            <option value="technical">Rebuild as Full technical</option>
        </select>
        <button class="btn btn-primary" id="dBuild">Download PPTX</button>
        <button class="btn btn-quiet btn-sm sp" id="dDelete">Remove</button>
    </div>
</aside>

<script>
const LIBRARY_ENABLED = {{ 'true' if library_enabled else 'false' }};
const ACCENT = {
    inventory_replenishment: 'var(--inventory)', merchandising: 'var(--merch)',
    pricing_promotions: 'var(--pricing)', data_intelligence: 'var(--data)'
};
const SOLUTION_LABEL = {
    inventory_replenishment: 'Inventory & Replenishment', merchandising: 'Merchandising',
    pricing_promotions: 'Pricing & Promotions', data_intelligence: 'Data & Intelligence'
};
const RATE_LABEL = { strong: 'Strong', partial: 'Partial', none: 'Gap', unknown: 'Unclear' };
const DEPTH_LABEL = { summary: 'Summary', standard: 'Standard', technical: 'Full technical' };

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

let open = null;
let timer = null;

function when(iso) {
    if (!iso) return '';
    const days = Math.floor((Date.now() - new Date(iso)) / 86400000);
    if (days <= 0) return 'today';
    if (days === 1) return 'yesterday';
    if (days < 30) return days + ' days ago';
    return new Date(iso).toLocaleDateString(undefined, { month: 'short', year: 'numeric' });
}

async function load() {
    if (!LIBRARY_ENABLED) {
        $('counts').innerHTML = '';
        $('results').innerHTML = `<div class="empty"><b>The library is not connected</b>
            <p>This deployment has no database attached, so cards are not being shared.
            Add a Render Postgres instance and set DATABASE_URL, then every card
            generated lands here automatically.</p>
            <a class="btn btn-primary" href="/">Build a card anyway</a></div>`;
        return;
    }
    const params = new URLSearchParams();
    if ($('q').value.trim()) params.set('q', $('q').value.trim());
    if ($('product').value) params.set('product', $('product').value);
    const data = await fetch('/api/library?' + params).then(r => r.json());

    const s = data.stats || {};
    $('counts').innerHTML = [
        [s.cards || 0, 'cards'], [s.competitors || 0, 'competitors'],
        [s.products || 0, 'IA products']
    ].map(([n, l]) => `<div class="count"><b>${n}</b><span>${l}</span></div>`).join('');

    if ($('product').options.length === 1) {
        $('product').innerHTML += (data.products || [])
            .map(p => `<option value="${esc(p)}">${esc(p)}</option>`).join('');
    }
    render(data.cards || []);
}

function render(cards) {
    if (!cards.length) {
        const filtered = $('q').value.trim() || $('product').value;
        $('results').innerHTML = `<div class="empty">
            <b>${filtered ? 'Nothing matches that' : 'The library is empty'}</b>
            <p>${filtered ? 'Try a different competitor or clear the filters.'
                          : 'Generate the first battlecard and it will appear here for everyone.'}</p>
            <a class="btn btn-primary" href="/">Build a card</a></div>`;
        return;
    }
    $('results').innerHTML = '<div class="grid">' + cards.map(c => {
        const accent = ACCENT[c.solution] || 'var(--data)';
        const pills = [];
        pills.push(`<span class="pill blue">${esc(c.ia_product || 'Portfolio')}</span>`);
        pills.push(`<span class="pill">${c.slide_count} slides</span>`);
        if (c.depth) pills.push(`<span class="pill">${esc(DEPTH_LABEL[c.depth] || c.depth)}</span>`);
        if (c.curated) pills.push('<span class="pill good">Hand researched</span>');
        if (c.unverified) pills.push(`<span class="pill warn">${c.unverified} unverified</span>`);
        return `<article class="card" data-id="${c.id}">
            <div class="accent" style="background:${accent}"></div>
            <div class="pad">
                <div class="kicker">
                    <span class="dot" style="background:${accent}"></span>
                    ${esc(SOLUTION_LABEL[c.solution] || 'Battlecard')}
                </div>
                <h3>${esc(c.competitor)}</h3>
                <div class="line">${esc(c.headline || c.win_theme || 'No headline yet.')}</div>
                <div class="foot">${pills.join('')}<span class="when">${when(c.created_at)}</span></div>
            </div></article>`;
    }).join('') + '</div>';

    $('results').querySelectorAll('.card').forEach(el =>
        el.onclick = () => show(el.dataset.id));
}

// ── detail drawer ───────────────────────────────────────────────────────────
async function show(id) {
    const data = await fetch('/api/library/' + id).then(r => r.json());
    if (data.error) return;
    open = data;
    const card = data.card || {};
    const meta = card.meta || {};

    $('dTitle').textContent = data.competitor;
    $('dSub').textContent = [
        meta.ia_product || 'Portfolio', DEPTH_LABEL[data.depth] || data.depth,
        data.slide_count + ' slides', data.author ? 'by ' + data.author : '',
        when(data.created_at), data.views + ' view' + (data.views === 1 ? '' : 's')
    ].filter(Boolean).join('  ·  ');

    let html = '';
    const track = card.talk_track || {};
    if (track.positioning) {
        html += `<div class="quote"><h4>Say this first</h4><p>${esc(track.positioning)}</p></div>`;
    }
    if (meta.win_theme) {
        html += sec('Win theme', `<p>${esc(meta.win_theme)}</p>`);
    }
    const pos = card.positioning || {};
    if (pos.wedge) html += sec('The wedge', `<p>${esc(pos.wedge)}</p>`);
    if ((card.our_advantages || []).length) {
        html += sec('Why we win', '<ul>' + card.our_advantages.map(a =>
            `<li><b>${esc(a.title)}</b>. ${esc(a.detail)}</li>`).join('') + '</ul>');
    }
    if ((card.their_strengths || []).length) {
        html += sec('Where they win', '<ul>' + card.their_strengths
            .map(x => `<li>${esc(x)}</li>`).join('') + '</ul>');
    }
    if ((card.comparison || []).length) {
        html += sec('Head to head', `<table class="matrix">
            <tr><th>Capability</th><th>IA</th><th>${esc(data.competitor)}</th></tr>
            ${card.comparison.map(r => `<tr>
                <td class="cap">${esc(r.capability)}</td>
                <td><span class="rate ${esc(r.ia)}">${esc(RATE_LABEL[r.ia] || r.ia)}</span></td>
                <td><span class="rate ${esc(r.competitor)}">${esc(RATE_LABEL[r.competitor] || r.competitor)}</span></td>
            </tr>`).join('')}</table>`);
    }
    if ((card.objections || []).length) {
        html += sec('Objection handling', '<ul>' + card.objections.map(o =>
            `<li><b>They say:</b> ${esc(o.objection)}<br><b>We say:</b> ${esc(o.response)}</li>`
        ).join('') + '</ul>');
    }
    if ((card.proof_points || []).length) {
        html += sec('Proof points', '<ul>' + card.proof_points.map(p =>
            `<li><b>${esc(p.stat)}</b> ${esc(p.label)}${p.source ? ' · <span style="color:var(--gray3)">' + esc(p.source) + '</span>' : ''}</li>`
        ).join('') + '</ul>');
    }
    $('dBody').innerHTML = html || '<div class="sec"><p>This card has no content yet.</p></div>';
    $('dBody').scrollTop = 0;
    $('dDepth').value = '';
    $('drawer').classList.add('on');
    $('drawer').setAttribute('aria-hidden', 'false');
    $('scrim').classList.add('on');
}

function sec(title, inner) {
    return `<div class="sec"><h4>${esc(title)}</h4>${inner}</div>`;
}

function close() {
    $('drawer').classList.remove('on');
    $('drawer').setAttribute('aria-hidden', 'true');
    $('scrim').classList.remove('on');
    open = null;
}

$('dClose').onclick = close;
$('scrim').onclick = close;
document.addEventListener('keydown', e => { if (e.key === 'Escape' && open) close(); });

$('dBuild').onclick = async () => {
    if (!open) return;
    const btn = $('dBuild');
    const label = btn.textContent;
    btn.disabled = true;
    btn.innerHTML = '<span class="spin">&#9696;</span> Building';
    try {
        const res = await fetch('/api/library/' + open.id + '/build', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ depth: $('dDepth').value || undefined })
        });
        const data = await res.json();
        if (data.download_url) window.location = data.download_url;
    } finally {
        btn.disabled = false; btn.textContent = label;
    }
};

$('dDelete').onclick = async () => {
    if (!open || !confirm('Remove the ' + open.competitor + ' card from the shared library?')) return;
    await fetch('/api/library/' + open.id, { method: 'DELETE' });
    close();
    load();
};

$('q').addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(load, 220); });
$('product').onchange = load;
$('clearBtn').onclick = () => { $('q').value = ''; $('product').value = ''; load(); };

load();
</script>
</body>
</html>

services:
  - type: web
    name: ia-slide-standardizer
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: 10000
      # Set both in the Render dashboard to gate the app. Without them every
      # route is open, which is unsafe for a deck holding competitive content.
      - key: IA_AUTH_USER
        sync: false
      - key: IA_AUTH_PASSWORD
        sync: false
      # Required for competitor research and the in-app assistant. Without it the
      # builder still assembles saved cards, but nothing is generated.
      - key: ANTHROPIC_API_KEY
        sync: false
      # Wired automatically from the database below. Without it the builder still
      # works, but generated cards are not shared.
      - key: DATABASE_URL
        fromDatabase:
          name: ia-battlecards-db
          property: connectionString

databases:
  - name: ia-battlecards-db
    plan: free
    databaseName: battlecards
    user: battlecards

services:
  - type: web
    name: ia-competitor-intelligence
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: 10000
      # Point this at a managed Postgres so the library survives deploys.
      # Render's filesystem is ephemeral, so without DATABASE_URL the SQLite
      # file is wiped every time the service redeploys or restarts.
      - key: DATABASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false        # set in the Render dashboard, never in git
      - key: CIQ_ADMIN_PASSCODE
        sync: false
      - key: CIQ_SECRET_KEY
        generateValue: true

# Two ways to get durable storage. Pick one.
#
# 1. Let Render provision the database. Keep the databases block below and
#    Render fills DATABASE_URL in itself, so there is no connection string to
#    copy, no password to encode and nothing to mistype.
#
# 2. Bring your own (Supabase, Neon). Delete the databases block and the
#    fromDatabase lines, then set the credentials as separate variables in the
#    dashboard: CIQ_DB_HOST, CIQ_DB_USER, CIQ_DB_PASSWORD, CIQ_DB_NAME and
#    CIQ_DB_PORT. Supplied separately, a password needs no percent-encoding.

databases:
  - name: ciq-postgres
    plan: free          # free Postgres expires after 30 days; upgrade to keep it
    databaseName: ciq
    user: ciq

services:
  - type: web
    name: ia-competitor-intelligence
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: ciq-postgres
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false        # set in the Render dashboard, never in git
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: CIQ_SECRET_KEY
        generateValue: true
      # Cost controls. Research is the largest single cost and is opt in per
      # request; the daily cap is a hard stop, not a warning.
      - key: CIQ_DAILY_BUDGET_USD
        value: "5.00"
      - key: CIQ_EFFORT
        value: medium
      - key: CIQ_RESEARCH_BY_DEFAULT
        value: "false"

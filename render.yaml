# Render Blueprint — one-click deploy of the IA Account Scanner.
#
# In Render:  New  >  Blueprint  >  pick this repo.  Render reads this file, builds
# the Docker image (see ./Dockerfile), then prompts you to paste the three secret
# values below. The secrets are entered in Render's GUI and are NEVER committed.
services:
  - type: web
    name: ia-account-scanner
    runtime: docker
    dockerfilePath: ./Dockerfile
    branch: claude/edgar-techstack-news-scanner-3cb5jm
    # "free" = $0/month, no card required. Sleeps after ~15 min idle and cold-starts
    # (~30-60s) on the next request. Change to "starter" ($7/mo) for always-on.
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # sync:false => Render prompts for the value on deploy and stores it server-side
      # only. Paste each key into the GUI field (no terminal paste to corrupt).
      - key: ANTHROPIC_API_KEY   # enables Claude web-search news + web-verified company facts
        sync: false
      - key: APOLLO_API_KEY      # enables Account info + Contacts
        sync: false
      - key: SERPAPI_KEY         # optional now: only used as fallback (or when NEWS_SOURCE=serp)
        sync: false
      # News backend: "auto" (default) prefers Claude web search when ANTHROPIC_API_KEY
      # is set (0 SerpAPI credits/scan); "serp" forces SerpAPI; "anthropic" forces Claude.
      # - key: NEWS_SOURCE
      #   value: auto
      # Max searches Claude runs per scan when using its own web search (cost vs coverage).
      # - key: NEWS_WEB_SEARCH_MAX
      #   value: "6"
      # ── Google SSO (restricted to @impactanalytics.co) ──────────────────────
      - key: GOOGLE_CLIENT_ID       # from your Google Cloud OAuth client
        sync: false
      - key: GOOGLE_CLIENT_SECRET   # from your Google Cloud OAuth client
        sync: false
      - key: SESSION_SECRET         # Render auto-generates a strong random value
        generateValue: true
      # Who may sign in. Set ALLOWED_EMAILS to a comma-separated allowlist (any
      # domain, e.g. your personal Gmail) and/or ALLOWED_EMAIL_DOMAIN for a whole
      # domain. Access is granted if the email matches either.
      - key: ALLOWED_EMAILS         # e.g. you@gmail.com,teammate@gmail.com
        sync: false
      # - key: ALLOWED_EMAIL_DOMAIN  # defaults to impactanalytics.co; set "" to disable
      #   value: impactanalytics.co
      # ── My Dashboard: Salesforce accounts from a PRIVATE Google Sheet ────────
      # Service-account auth. Share the sheet (Viewer) with GOOGLE_SA_EMAIL; the
      # sheet is never made public. Get these from the service account's JSON key.
      - key: GOOGLE_SHEET_ID        # the id in the sheet URL: /d/<THIS>/edit
        sync: false
      - key: GOOGLE_SA_EMAIL        # service account client_email
        sync: false
      - key: GOOGLE_SA_PRIVATE_KEY  # service account private_key (paste the whole -----BEGIN...----- block)
        sync: false
      # - key: GOOGLE_SHEET_RANGE   # optional; defaults to "A:Z" (or set a tab, e.g. "Accounts!A:Z")
      #   value: A:Z
      # The Dockerfile sets PORT=10000 and a writable SCAN_CACHE_DIR; no need to set them here.
